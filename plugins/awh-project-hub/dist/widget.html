<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWH Project Hub</title>
  <style>:root {
  color-scheme: light dark;
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #e9ece7;
  --ink: #202420;
  --muted: #626a63;
  --line: #cbd1cb;
  --accent: #24635b;
  --accent-ink: #ffffff;
  --healthy: #236a47;
  --attention: #8a5b12;
  --blocked: #a13b34;
  --archived: #6b706b;
  --focus: #176f91;
  --sans: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  --mono: Consolas, "SFMono-Regular", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171a18;
    --surface: #202421;
    --surface-2: #2a302b;
    --ink: #f0f3ef;
    --muted: #aeb6af;
    --line: #414942;
    --accent: #65a99f;
    --accent-ink: #10211e;
    --healthy: #74bf91;
    --attention: #e0b25f;
    --blocked: #ea8179;
    --archived: #aeb4ae;
    --focus: #79c9e8;
  }
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }

body { font-family: var(--sans); letter-spacing: 0; }

button, input, select { font: inherit; }

button { cursor: pointer; }

button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.icon { width: 17px; height: 17px; stroke-width: 2; }

.icon-button {
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}

.primary-button {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}

.inline-launcher {
  width: min(100%, 680px);
  min-height: 154px;
  display: grid;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.launcher-head, .toolbar, .toolbar-actions, .summary-strip, .row-head, .task-meta, .detail-grid {
  display: flex;
  align-items: center;
}

.launcher-head, .toolbar, .row-head { justify-content: space-between; gap: 12px; }

.eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; }

h1, h2, h3, p { margin-top: 0; }

h1 { margin-bottom: 4px; font-size: 22px; line-height: 1.2; }

h2 { margin-bottom: 10px; font-size: 16px; line-height: 1.25; }

h3 { margin-bottom: 6px; font-size: 14px; line-height: 1.25; }

.muted { color: var(--muted); }

.small { font-size: 12px; }

.summary-strip { gap: 18px; flex-wrap: wrap; }

.summary-item { min-width: 88px; }

.summary-value { display: block; font-size: 20px; font-weight: 750; }

.health {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 750;
  text-transform: uppercase;
}

.health::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.health-healthy { color: var(--healthy); }
.health-attention { color: var(--attention); }
.health-blocked { color: var(--blocked); }
.health-archived { color: var(--archived); }

.workspace { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }

.toolbar {
  min-height: 72px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.toolbar-actions { gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.search-wrap { position: relative; }
.search-wrap .icon { position: absolute; top: 10px; left: 10px; color: var(--muted); pointer-events: none; }
.search-wrap input { width: min(34vw, 340px); min-width: 190px; height: 38px; padding: 0 10px 0 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
select { height: 38px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }

.status-banner { min-height: 36px; padding: 8px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
.status-banner.error { color: var(--blocked); }

.hub-grid {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(250px, .8fr) minmax(340px, 1.2fr) minmax(310px, 1fr);
}

.pane { min-width: 0; min-height: 0; padding: 14px; overflow: auto; border-right: 1px solid var(--line); }
.pane:last-child { border-right: 0; }

.pane-title { position: sticky; top: -14px; z-index: 2; padding: 14px 0 10px; background: var(--bg); }

.list { display: grid; gap: 7px; }

.list-row {
  width: 100%;
  min-height: 66px;
  padding: 10px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink);
}

.list-row:hover, .list-row.active { border-color: var(--accent); }
.list-row.active { box-shadow: inset 3px 0 0 var(--accent); }

.row-title { min-width: 0; overflow-wrap: anywhere; font-size: 14px; font-weight: 700; }
.row-subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.task-meta { gap: 8px; margin-top: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }

.role-badge { display: inline-flex; padding: 2px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--surface-2); font-family: var(--mono); font-size: 11px; }

.blocker { margin: 8px 0 0; padding-left: 9px; border-left: 3px solid var(--blocked); color: var(--blocked); font-size: 12px; line-height: 1.4; }

.detail-section { padding: 12px 0; border-bottom: 1px solid var(--line); }
.detail-section:first-of-type { padding-top: 0; }
.detail-grid { align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.detail-field { flex: 1 1 130px; min-width: 0; }
.detail-label { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; }
.detail-value { overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; }
.machine { font-family: var(--mono); font-size: 11px; }

.empty, .fatal { padding: 24px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); text-align: center; }
.fatal { width: min(100%, 680px); color: var(--blocked); background: var(--surface); text-align: left; }

[aria-busy="true"] .refresh-icon { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 980px) {
  .hub-grid { grid-template-columns: minmax(230px, .8fr) minmax(340px, 1.2fr); }
  .details-pane { grid-column: 1 / -1; border-top: 1px solid var(--line); border-right: 0; max-height: 42vh; }
}

@media (max-width: 720px) {
  .toolbar { align-items: flex-start; flex-direction: column; }
  .toolbar-actions { width: 100%; justify-content: flex-start; }
  .search-wrap { flex: 1 1 100%; }
  .search-wrap input { width: 100%; }
  .hub-grid { display: block; }
  .pane { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .details-pane { max-height: none; }
  .inline-launcher { min-height: 180px; }
  .launcher-head { align-items: flex-start; flex-direction: column; }
}
</style>
</head>
